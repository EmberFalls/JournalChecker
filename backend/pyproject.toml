[project]
name = "journal-integrity-api"
version = "0.1.0"
description = "Evidence-first scholarly journal integrity assessment MVP"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg>=3.2,<4",
  "alembic>=1.13,<2",
  "httpx>=0.27,<1",
  "redis>=5,<7",
  "rapidfuzz>=3.9,<4",
  "selectolax>=0.3,<1",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
include = ["app*"]
